<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grievance Redressal System</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', sans-serif; }
body { background:#f0f2f5; color:#333; }
a { text-decoration:none; color:#007bff; }
button { cursor:pointer; }

.container { width:100%; max-width:400px; margin:80px auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
h2 { text-align:center; margin-bottom:20px; color:#333; }
input, select, textarea { width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:8px; font-size:14px; }
button { width:100%; padding:12px; margin-top:10px; background:#007bff; color:#fff; border:none; border-radius:8px; font-size:16px; }
button:hover { background:#0056b3; }
.link { text-align:center; margin-top:10px; font-size:14px; }

.home { max-width:900px; margin:40px auto; padding:20px; }
.nav { display:flex; justify-content:space-between; align-items:center; background:#007bff; color:#fff; padding:15px 20px; border-radius:12px; }
.nav h2 { margin:0; font-size:22px; }
.nav .profile { cursor:pointer; border:1px solid #fff; padding:5px 10px; border-radius:8px; }
.buttons { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-top:30px; }
.buttons button { padding:20px; font-size:16px; border-radius:12px; }

.form-section, .profile-section, .list-section { background:#fff; padding:20px; border-radius:12px; margin-top:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
textarea { height:100px; }

#popup { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#28a745; color:#fff; padding:15px 25px; border-radius:12px; display:none; z-index:1000; }

.timeline { position:relative; margin-left:20px; }
.timeline::before { content:''; position:absolute; left:15px; top:0; bottom:0; width:4px; background:#007bff; }
.timeline-item { margin-bottom:20px; position:relative; padding-left:40px; }
.timeline-item::before { content:''; position:absolute; left:10px; top:5px; width:10px; height:10px; border-radius:50%; background:#007bff; }
.timeline-item span { font-size:12px; color:#555; display:block; margin-top:3px; }
</style>
</head>
<body>

<!-- Login/Register -->
<div id="login-register" class="container">
<h2>Login</h2>
<input type="text" id="loginEmail" placeholder="Email / Phone">
<input type="password" id="loginPassword" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="googleLogin()">Sign in with Google</button>
<div class="link">Don't have account? <a href="#" onclick="showRegister()">Register</a></div>
</div>

<div id="register" class="container" style="display:none;">
<h2>Register</h2>
<input type="text" id="regName" placeholder="Full Name">
<input type="text" id="regPhone" placeholder="Phone Number">
<input type="email" id="regEmail" placeholder="Email">
<input type="password" id="regPassword" placeholder="Password">
<input type="password" id="regConfirm" placeholder="Confirm Password">
<select id="regRole">
<option value="">Select Role</option>
<option value="student">Student</option>
<option value="citizen">Citizen</option>
<option value="admin">Admin</option>
</select>
<button onclick="register()">Register</button>
<div class="link">Already have account? <a href="#" onclick="showLogin()">Login</a></div>
</div>

<!-- Home Page -->
<div id="home" class="home" style="display:none;">
<div class="nav">
<h2>Dashboard</h2>
<div class="profile" onclick="toggleProfile()">Profile</div>
</div>

<div class="buttons">
<button onclick="showSection('submitComplaint')">Submit Complaint</button>
<button onclick="showSection('trackComplaint')">Track Complaint</button>
<button onclick="showSection('viewComplaints')">View Complaints</button>
<button onclick="showSection('notifications')">Notifications</button>
</div>

<div id="profileSection" class="profile-section" style="display:none;">
<h3>User Profile</h3>
<p id="profileInfo"></p>
<button onclick="logout()">Logout</button>
</div>

<div id="submitComplaint" class="form-section" style="display:none;">
<h3>Submit Complaint</h3>
<input type="text" id="complaintTitle" placeholder="Title">
<textarea id="complaintDesc" placeholder="Description"></textarea>
<input type="file" id="complaintUpload">
<button onclick="submitComplaint()">Submit</button>
</div>

<div id="trackComplaint" class="form-section" style="display:none;">
<h3>Track Complaint</h3>
<input type="text" id="trackID" placeholder="Enter Complaint ID">
<button onclick="trackComplaint()">Track</button>
<div id="trackResult"></div>
</div>

<div id="viewComplaints" class="list-section" style="display:none;">
<h3>Your Complaints</h3>
<ul id="complaintList"></ul>
</div>

<div id="notifications" class="list-section" style="display:none;">
<h3>Notifications</h3>
<ul id="notificationList"></ul>
</div>
</div>

<div id="popup"></div>

<script>
// Data Storage
let users = [];
let complaints = [];
let notifications = [];

// Show Register/Login
function showRegister(){ document.getElementById('login-register').style.display='none'; document.getElementById('register').style.display='block'; }
function showLogin(){ document.getElementById('register').style.display='none'; document.getElementById('login-register').style.display='block'; }

// Login
function login(){
  const email=document.getElementById('loginEmail').value;
  const pass=document.getElementById('loginPassword').value;
  const user=users.find(u=>u.email===email && u.password===pass);
  if(user){ localStorage.setItem('currentUser',JSON.stringify(user)); showHome(); }
  else alert('Invalid credentials!');
}
function googleLogin(){ alert('Google Sign-in (Simulated)'); }

// Register
function register(){
  const name=document.getElementById('regName').value;
  const phone=document.getElementById('regPhone').value;
  const email=document.getElementById('regEmail').value;
  const pass=document.getElementById('regPassword').value;
  const confirm=document.getElementById('regConfirm').value;
  const role=document.getElementById('regRole').value;
  if(pass!==confirm){ alert("Passwords don't match"); return; }
  if(role==='admin'){ const otp=prompt("Enter Admin OTP (1234)"); if(otp!=='1234'){ alert("Invalid OTP"); return; } }
  users.push({name,phone,email,password:pass,role,verified:true});
  alert('Registered successfully'); showLogin();
}

// Home
function showHome(){
  document.getElementById('login-register').style.display='none';
  document.getElementById('register').style.display='none';
  document.getElementById('home').style.display='block';
  const currentUser=JSON.parse(localStorage.getItem('currentUser'));
  document.getElementById('profileInfo').innerHTML=`Name: ${currentUser.name}<br>Email: ${currentUser.email}<br>Phone: ${currentUser.phone}<br>Role: ${currentUser.role}`;
  updateNotifications();
}
function toggleProfile(){
  const p=document.getElementById('profileSection');
  p.style.display=p.style.display==='none'?'block':'none';
}
function logout(){ localStorage.removeItem('currentUser'); document.getElementById('home').style.display='none'; showLogin(); }
function showSection(id){
  ['submitComplaint','trackComplaint','viewComplaints','notifications'].forEach(s=>document.getElementById(s).style.display='none');
  document.getElementById(id).style.display='block';
  if(id==='viewComplaints') showUserComplaints();
  if(id==='notifications') updateNotifications();
}

// Popup
function showPopup(msg){
  const p=document.getElementById('popup'); p.innerText=msg; p.style.display='block';
  setTimeout(()=>{p.style.display='none';},3000);
}

// Submit Complaint
function submitComplaint(){
  const title=document.getElementById('complaintTitle').value;
  const desc=document.getElementById('complaintDesc').value;
  if(!title || !desc){ alert("Enter all fields"); return; }
  const id='CMP'+Math.floor(Math.random()*10000);
  const user=JSON.parse(localStorage.getItem('currentUser'));
  const now=new Date().toLocaleString();
  complaints.push({id,title,desc,user:user.email,date:now,status:'Submitted'});
  notifications.push({id:id,user:user.email,status:'Submitted'});
  showPopup(`Complaint Submitted! ID: ${id}`);
  document.getElementById('complaintTitle').value=''; document.getElementById('complaintDesc').value='';
}

// Track Complaint
function trackComplaint(){
  const id=document.getElementById('trackID').value;
  const c=complaints.find(x=>x.id===id);
  const result=document.getElementById('trackResult');
  if(!c){ result.innerText='Complaint not found'; return; }
  const steps=['Submitted','In Progress','Resolved'];
  result.innerHTML='<h4>Status Timeline</h4><div class="timeline">';
  steps.forEach(step=>{
    let color='#007bff';
    if(step===c.status) color='#28a745';
    const timestamp=(step==='Submitted')?c.date:(step==='In Progress'?c.date:''); // Using same date for demo
    result.innerHTML+=`<div class="timeline-item" style="color:${color}">${step}${timestamp?'<span>'+timestamp+'</span>':''}</div>`;
  });
  result.innerHTML+='</div>';
}

// View Complaints
function showUserComplaints(){
  const user=JSON.parse(localStorage.getItem('currentUser'));
  const list=document.getElementById('complaintList'); list.innerHTML='';
  complaints.filter(c=>c.user===user.email).forEach(c=>{
    const li=document.createElement('li'); li.innerText=`${c.id} - ${c.title} (${c.status})`; list.appendChild(li);
  });
}

// Notifications
function updateNotifications(){
  const user=JSON.parse(localStorage.getItem('currentUser'));
  const list=document.getElementById('notificationList'); list.innerHTML='';
  const userComplaints=complaints.filter(c=>c.user===user.email);
  if(userComplaints.length===0){ list.innerHTML='<li>No complaints yet</li>'; return; }
  userComplaints.forEach(c=>{
    const li=document.createElement('li'); 
    let color='#007bff'; if(c.status==='In Progress') color='#ffc107'; if(c.status==='Resolved') color='#28a745';
    li.innerHTML=`Complaint ${c.id} - "${c.title}" is currently: <span style="color:${color};">${c.status}</span>`;
    list.appendChild(li);
  });
}

// Simulate status change every 15s
setInterval(()=>{ complaints.forEach(c=>{ if(c.status==='Submitted') c.status='In Progress'; else if(c.status==='In Progress') c.status='Resolved'; }); updateNotifications(); },15000);

</script>
</body>
</html>
